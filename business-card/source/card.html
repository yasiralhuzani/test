<!doctype html><html lang="ar"><head><meta charset="utf-8">
<style>
@font-face{font-family:Plex;font-weight:300;src:url(fonts/plex-1.ttf)}
@font-face{font-family:Plex;font-weight:400;src:url(fonts/plex-2.ttf)}
@font-face{font-family:Plex;font-weight:600;src:url(fonts/plex-3.ttf)}
@font-face{font-family:Plex;font-weight:700;src:url(fonts/plex-4.ttf)}
@font-face{font-family:Mont;font-weight:400;src:url(fonts/mont-5.ttf)}
@font-face{font-family:Mont;font-weight:600;src:url(fonts/mont-6.ttf)}
@page{size:96mm 56mm;margin:0}
*{margin:0;padding:0;box-sizing:border-box}
/* deep blue harmonised with the KSU blue; teal accent taken from the Digest mark */
:root{--deep:#0B3B5C;--blue:#0A6FA0;--teal:#3FBFCB;--ink:#1d2433;--muted:#4f5868}
/* page = 90x50mm card + 3mm bleed each side; all text >= 4mm inside the trim */
.page{width:96mm;height:56mm;position:relative;overflow:hidden;page-break-after:always;background:#fff;color:var(--ink)}
.ar{direction:rtl;font-family:Plex,sans-serif}
.en{direction:ltr;font-family:Mont,Plex,sans-serif}
.ltr{direction:ltr;unicode-bidi:isolate}

/* footer band: visible 9mm (card y 41-50mm) */
.foot{position:absolute;left:0;right:0;bottom:0;height:12mm;background:var(--deep);color:#fff}
.foot i{position:absolute;left:0;right:0;top:0;height:.6mm;background:var(--teal)}
.foot .wa{position:absolute;left:0;right:0;top:.6mm;height:8.4mm;display:flex;align-items:center;justify-content:center;gap:2.4mm}
.wa svg{width:4.4mm;height:4.4mm;fill:none;stroke:var(--teal);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.wa .lbl{font-size:7.2pt;color:rgba(255,255,255,.8);line-height:1.15}
.wa .num{font-family:Mont;font-weight:600;font-size:10pt;letter-spacing:.4pt}

/* Arabic side */
.ar .content{position:absolute;top:7mm;left:7.5mm;right:7.5mm;bottom:15mm;display:flex;align-items:center;justify-content:space-between;gap:5mm}
.ar .main{display:flex;flex-direction:column;align-items:flex-start;gap:4.5mm}
.logos{display:flex;align-items:center;gap:4mm}
.logos .sep{width:.25mm;height:7.5mm;background:#d5d8de}
.logo{display:block;object-fit:contain}
.logo.ksumc{height:9.5mm}
.logo.digest{height:6.8mm}
.ar .name{font-weight:700;font-size:13.5pt;color:var(--deep);line-height:1.2}
.ar .title{font-weight:600;font-size:9pt;color:var(--blue);margin-top:.5mm}
.ar .qr span{font-size:6pt}

/* English side */
.en .content{position:absolute;top:7mm;left:7.5mm;right:7.5mm;bottom:15mm;display:flex;align-items:center;justify-content:space-between;gap:5mm}
.en .name{font-weight:600;font-size:11pt;color:var(--deep);line-height:1.25;letter-spacing:.1pt}
.en .title{font-weight:600;font-size:7.6pt;color:var(--blue);margin-top:.8mm}
.en .rule{width:9mm;height:.5mm;background:var(--teal);margin:2.6mm 0 2.2mm}
.en .aff{font-size:6.8pt;color:var(--muted);line-height:1.55}
.qr{display:flex;flex-direction:column;align-items:center;gap:2.6mm;flex:none}
.qr img{width:17mm;height:17mm;display:block}
.qr span{font-size:5.6pt;color:var(--muted);text-align:center;line-height:1.3}
</style></head><body>

<!-- الوجه العربي -->
<section class="page ar">
  <div class="content">
    <div class="main">
      <div class="logos">
        <img class="logo ksumc" src="logos/ksumc.png" alt="">
        <div class="sep"></div>
        <img class="logo digest" src="logos/digest.png" alt="">
      </div>
      <div class="id">
        <div class="name">د. ياسر عبدالله الهزاني</div>
        <div class="title">استشاري طب الأسرة</div>
      </div>
    </div>
    <div class="qr"><img src="logos/wa-qr.svg" alt=""><span>امسح الرمز<br>للتواصل عبر واتساب</span></div>
  </div>
  <div class="foot"><i></i><div class="wa">
    <svg viewBox="0 0 24 24"><path d="M3.5 20.5l1.3-4.2A8.5 8.5 0 1 1 8 19.4z"/><path d="M9 8.5c0 3.5 3 6.5 6.5 6.5l1-1.5-2-1-1 .8a5 5 0 0 1-2.8-2.8l.8-1-1-2z"/></svg>
    <span class="num ltr">053 649 9897</span>
  </div></div>
</section>

<!-- English side -->
<section class="page en">
  <div class="content">
    <div>
      <div class="name">Dr. Yasir A. Alhuzani</div>
      <div class="title">Family Medicine Consultant</div>
      <div class="rule"></div>
      <div class="aff">King Saud University Medical City<br>Integrated Medical Care Complex (DIGEST)</div>
    </div>
    <div class="qr"><img src="logos/wa-qr.svg" alt=""><span>Scan to chat<br>on WhatsApp</span></div>
  </div>
  <div class="foot"><i></i><div class="wa">
    <svg viewBox="0 0 24 24"><path d="M3.5 20.5l1.3-4.2A8.5 8.5 0 1 1 8 19.4z"/><path d="M9 8.5c0 3.5 3 6.5 6.5 6.5l1-1.5-2-1-1 .8a5 5 0 0 1-2.8-2.8l.8-1-1-2z"/></svg>
    <span class="num">+966 53 649 9897</span>
  </div></div>
</section>
</body></html>

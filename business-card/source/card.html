<!doctype html><html lang="ar"><head><meta charset="utf-8">
<style>
@font-face{font-family:Plex;font-weight:300;src:url(fonts/plex-1.ttf)}
@font-face{font-family:Plex;font-weight:400;src:url(fonts/plex-2.ttf)}
@font-face{font-family:Plex;font-weight:600;src:url(fonts/plex-3.ttf)}
@font-face{font-family:Plex;font-weight:700;src:url(fonts/plex-4.ttf)}
@font-face{font-family:Mont;font-weight:400;src:url(fonts/mont-5.ttf)}
@font-face{font-family:Mont;font-weight:600;src:url(fonts/mont-6.ttf)}
@page{size:96mm 56mm;margin:0}
*{margin:0;padding:0;box-sizing:border-box}
:root{--navy:#14213D;--gold:#C9A227;--ink:#1d2433;--muted:#6b7385}
/* page = 90x50mm card + 3mm bleed each side; keep text >= 4mm inside trim */
.page{width:96mm;height:56mm;position:relative;overflow:hidden;page-break-after:always;background:#fff;color:var(--ink)}
.ar{direction:rtl;font-family:Plex,sans-serif}
.en{direction:ltr;font-family:Mont,Plex,sans-serif}
.ltr{direction:ltr;unicode-bidi:isolate}

.content{position:absolute;top:6.5mm;left:7mm;right:7mm;bottom:14mm;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6mm;text-align:center}
.logos{display:flex;align-items:center;justify-content:center;gap:5mm}
.logos .sep{width:.25mm;height:9mm;background:#d5d8de}
.logo{display:block;object-fit:contain}
.logo.ksumc{height:11.5mm}
.logo.digest{height:6.8mm}

.name{font-weight:700;color:var(--navy);line-height:1.2}
.ar .name{font-size:13pt}
.en .name{font-family:Mont;font-weight:600;font-size:10.5pt;letter-spacing:.3pt}
.title{color:var(--gold);font-weight:600;margin-top:.8mm}
.ar .title{font-size:8pt}
.en .title{font-size:7pt}
.aff{color:var(--muted);margin-top:.5mm}
.ar .aff{font-size:6.2pt}
.en .aff{font-size:5.1pt}
.aff .dot{color:#c3c7cf;margin:0 1.4mm}

.foot{position:absolute;left:0;right:0;bottom:0;height:12mm;background:var(--navy);color:#fff}
.foot i{position:absolute;left:0;right:0;top:0;height:.7mm;background:var(--gold)}
/* visible band = 9mm (from 44mm to 53mm); center text in it */
.foot .wa{position:absolute;left:0;right:0;top:.7mm;height:8.3mm;display:flex;align-items:center;justify-content:center;gap:2.2mm}
.wa svg{width:4.2mm;height:4.2mm;fill:none;stroke:var(--gold);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.wa .lbl{font-size:7pt;color:rgba(255,255,255,.75)}
.wa .num{font-family:Mont;font-weight:600;font-size:9.5pt;letter-spacing:.4pt}
</style></head><body>

<!-- الوجه العربي -->
<section class="page ar">
  <div class="content">
    <div class="logos">
      <img class="logo ksumc" src="logos/ksumc.png" alt="">
      <div class="sep"></div>
      <img class="logo digest" src="logos/digest.png" alt="">
    </div>
    <div>
      <div class="name">د. ياسر عبدالله الهزاني</div>
      <div class="title">استشاري طب الأسرة</div>
      <div class="aff">المدينة الطبية بجامعة الملك سعود<span class="dot">|</span>مركز تكامل الرعاية الطبي (هضم)</div>
    </div>
  </div>
  <div class="foot"><i></i><div class="wa">
    <svg viewBox="0 0 24 24"><path d="M3.5 20.5l1.3-4.2A8.5 8.5 0 1 1 8 19.4z"/><path d="M9 8.5c0 3.5 3 6.5 6.5 6.5l1-1.5-2-1-1 .8a5 5 0 0 1-2.8-2.8l.8-1-1-2z"/></svg>
    <span class="lbl">واتساب</span><span class="num ltr">053 649 9897</span>
  </div></div>
</section>

<!-- English side -->
<section class="page en">
  <div class="content">
    <div class="logos">
      <img class="logo ksumc" src="logos/ksumc.png" alt="">
      <div class="sep"></div>
      <img class="logo digest" src="logos/digest.png" alt="">
    </div>
    <div>
      <div class="name">Dr. Yasir A. Alhuzani</div>
      <div class="title">Family Medicine Consultant</div>
      <div class="aff">King Saud University Medical City<span class="dot">|</span>Takamul Al-Riaya Medical Center (Digest)</div>
    </div>
  </div>
  <div class="foot"><i></i><div class="wa">
    <svg viewBox="0 0 24 24"><path d="M3.5 20.5l1.3-4.2A8.5 8.5 0 1 1 8 19.4z"/><path d="M9 8.5c0 3.5 3 6.5 6.5 6.5l1-1.5-2-1-1 .8a5 5 0 0 1-2.8-2.8l.8-1-1-2z"/></svg>
    <span class="lbl">WhatsApp</span><span class="num">+966 53 649 9897</span>
  </div></div>
</section>
</body></html>
